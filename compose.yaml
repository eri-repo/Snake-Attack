services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      POSTGRES_DB: rusty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      DATABASE_URL: postgres://postgres:postgrespw@db:5432/rusty
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rusty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: